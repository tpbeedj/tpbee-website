<style>
  body {
    padding-top: 24px;
    padding-bottom: 60px;
  }

  #ep-page {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 0;
    color: var(--text-color);
    font-family: var(--font-primary);
    -webkit-font-smoothing: antialiased;
    --ep-line: rgba(255, 255, 255, 0.16);
    --ep-dim: rgba(255, 255, 255, 0.6);
  }
  #ep-page * { box-sizing: border-box; }

  #ep-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-left: 21px;
  }
  #ep-header a {
    display: block;
    flex-shrink: 0;
    line-height: 0;
    transition: opacity 120ms ease;
  }
  #ep-header a:hover { opacity: 0.85; }
  #ep-header img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
  }
  #ep-header h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.2;
  }

  .ep-card {
    background: var(--link-bg);
    -webkit-backdrop-filter: blur(20px) brightness(1.1) contrast(0.9);
    backdrop-filter: blur(20px) brightness(1.1) contrast(0.9);
    border-radius: var(--link-radius);
    box-shadow: var(--link-shadow);
    padding: 18px 20px;
    margin-bottom: var(--link-gap);
  }

  /* Subscribe bar */
  .ep-sub p {
    margin: 0 0 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .ep-sub p span { color: var(--ep-dim); }
  .ep-sub-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ep-btn {
    display: inline-block;
    padding: 9px 14px;
    border-radius: var(--link-inner-radius);
    border: 1px solid var(--ep-line);
    background: var(--link-bg);
    color: var(--text-color);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ep-btn:hover { background: var(--link-bg-hover); border-color: rgba(255, 255, 255, 0.3); }
  .ep-btn.primary { background: var(--accent-color); border-color: var(--accent-color); }
  .ep-btn.primary:hover { filter: brightness(1.1); }

  /* Episodes */
  .ep-h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    color: var(--accent-color);
    margin: 26px 0 10px;
  }
  .ep-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .ep-top img {
    width: 84px;
    height: 84px;
    border-radius: var(--link-inner-radius);
    object-fit: cover;
    flex-shrink: 0;
  }
  .ep-meta { min-width: 0; }
  .ep-title {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  .ep-date { margin: 0; color: var(--ep-dim); font-size: 13px; }
  .ep-intro {
    margin: 12px 0 0;
    color: var(--ep-dim);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-line;
  }
  .ep-player {
    width: 100%;
    height: 166px;
    border: 0;
    border-radius: var(--link-inner-radius);
    margin-top: 14px;
    display: block;
  }
  .ep-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-top: 14px;
  }
  .ep-actions .ep-small {
    color: var(--ep-dim);
    font-size: 13px;
  }
  .ep-actions a.ep-small:hover { color: var(--text-color); }
  details.ep-tracks { margin-top: 12px; }
  details.ep-tracks summary {
    cursor: pointer;
    color: var(--ep-dim);
    font-size: 13px;
  }
  details.ep-tracks summary:hover { color: var(--text-color); }
  details.ep-tracks ol {
    margin: 10px 0 0;
    padding-left: 22px;
    font-size: 13px;
    line-height: 1.7;
  }
  #ep-error {
    color: var(--ep-dim);
    font-size: 14px;
  }
</style>

<body>

<div id="page-background" aria-hidden="true"></div>

<main id="ep-page">

  <header id="ep-header">
    <a href="/" aria-label="Back to tpb.ee">
      <img src="/assets/avatar.jpg" alt="tpbee profile picture" width="64" height="64">
    </a>
    <h1>Episodes</h1>
  </header>

  <div class="ep-card ep-sub">
    <p>A fresh mix of liquid and deeper drum &amp; bass every couple of weeks. <span>Subscribe and each new one lands as it drops.</span></p>
    <div class="ep-sub-buttons">
      <a class="ep-btn primary" href="https://podcasts.apple.com/us/podcast/diving-deeper-dnb-with-tpbee/id1849227916" target="_blank" rel="noopener">Apple Podcasts</a>
      <a class="ep-btn" href="https://pca.st/itunes/1849227916" target="_blank" rel="noopener">Pocket Casts</a>
      <a class="ep-btn" href="https://soundcloud.com/tpbee" target="_blank" rel="noopener">Follow on SoundCloud</a>
      <a class="ep-btn" href="https://www.youtube.com/@tpbee?sub_confirmation=1" target="_blank" rel="noopener">Subscribe on YouTube</a>
    </div>
  </div>

  <div id="ep-latest"></div>

  <h2 class="ep-h2" id="ep-archive-h" hidden>All episodes</h2>
  <div id="ep-archive"></div>

  <p id="ep-error" hidden>Couldn't load the episode list - everything is on <a href="https://soundcloud.com/tpbee">SoundCloud</a> in the meantime.</p>

</main>

<script>
(function(){
  var APPLE = "https://podcasts.apple.com/us/podcast/diving-deeper-dnb-with-tpbee/id1849227916";
  var POCKET = "https://pca.st/itunes/1849227916";
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function niceDate(iso) {
    var p = iso.split("-");
    return parseInt(p[2], 10) + " " + MONTHS[parseInt(p[1], 10) - 1] + " " + p[0];
  }
  function link(cls, href, text) {
    var a = el("a", cls, text);
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener";
    return a;
  }

  function card(ep, featured) {
    var c = el("article", "ep-card");
    var top = el("div", "ep-top");
    var img = el("img");
    img.src = ep.image;
    img.alt = "";
    img.loading = featured ? "eager" : "lazy";
    img.width = 84; img.height = 84;
    top.appendChild(img);
    var meta = el("div", "ep-meta");
    meta.appendChild(el("h3", "ep-title", ep.title));
    meta.appendChild(el("p", "ep-date", niceDate(ep.date)));
    top.appendChild(meta);
    c.appendChild(top);

    if (featured && ep.intro) c.appendChild(el("p", "ep-intro", ep.intro));

    if (featured && ep.track_id) {
      var f = el("iframe", "ep-player");
      f.title = "Play " + ep.title + " on SoundCloud";
      f.allow = "autoplay";
      f.loading = "lazy";
      f.src = "https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/" + ep.track_id +
              "&visual=true&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false";
      c.appendChild(f);
    }

    var actions = el("div", "ep-actions");
    if (!featured) actions.appendChild(link("ep-btn", ep.url, "Listen on SoundCloud"));
    actions.appendChild(el("span", "ep-small", "Get every episode:"));
    actions.appendChild(link("ep-small", APPLE, "Apple Podcasts"));
    actions.appendChild(link("ep-small", POCKET, "Pocket Casts"));
    c.appendChild(actions);

    if (ep.tracklist && ep.tracklist.length) {
      var d = el("details", "ep-tracks");
      if (featured) d.open = true;
      d.appendChild(el("summary", null, "Tracklist (" + ep.tracklist.length + ")"));
      var ol = el("ol");
      ep.tracklist.forEach(function(t){ ol.appendChild(el("li", null, t)); });
      d.appendChild(ol);
      c.appendChild(d);
    }
    return c;
  }

  fetch("/episodes/episodes.json", {cache: "no-cache"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(eps){
      if (!eps.length) throw new Error("empty");
      document.getElementById("ep-latest").appendChild(card(eps[0], true));
      var arch = document.getElementById("ep-archive");
      eps.slice(1).forEach(function(ep){ arch.appendChild(card(ep, false)); });
      document.getElementById("ep-archive-h").hidden = eps.length < 2;
    })
    .catch(function(){ document.getElementById("ep-error").hidden = false; });
})();
</script>
</body>
